<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: #c9a98a;
  }

  /* Photographic background simulation */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(180,140,100,0.7) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(160,120,80,0.6) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 20%, rgba(210,175,140,0.5) 0%, transparent 40%),
      linear-gradient(160deg, #b8957a 0%, #d4b090 20%, #c2a07e 40%, #a8876a 60%, #c5a585 80%, #b89070 100%);
  }

  /* Tree/foliage overlay top */
  .foliage-top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 220px;
    z-index: 1;
    pointer-events: none;
  }

  /* Ground/grass overlay bottom */
  .ground {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 180px;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(to top, rgba(160,120,70,0.6) 0%, transparent 100%);
  }

  /* Shadow dappling overlay */
  .dapple {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60px 120px at 30% 70%, rgba(80,50,20,0.18) 0%, transparent 100%),
      radial-gradient(ellipse 40px 90px at 55% 80%, rgba(80,50,20,0.15) 0%, transparent 100%),
      radial-gradient(ellipse 80px 40px at 70% 60%, rgba(80,50,20,0.12) 0%, transparent 100%),
      radial-gradient(ellipse 50px 100px at 15% 50%, rgba(80,50,20,0.10) 0%, transparent 100%),
      radial-gradient(ellipse 35px 70px at 85% 40%, rgba(80,50,20,0.14) 0%, transparent 100%);
  }

  /* Building/structure on left background */
  .building {
    position: fixed;
    top: 40px;
    left: -20px;
    width: 200px;
    height: 250px;
    z-index: 1;
    pointer-events: none;
    opacity: 0.35;
    background: linear-gradient(135deg, #d4b896 0%, #c0a07a 100%);
    border-radius: 4px;
  }
  .building::before {
    content: '';
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    bottom: 20px;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 18px,
      rgba(100,70,40,0.2) 18px,
      rgba(100,70,40,0.2) 20px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 28px,
      rgba(100,70,40,0.15) 28px,
      rgba(100,70,40,0.15) 30px
    );
  }

  /* Phone frame wrapper */
  .phone-wrapper {
    position: relative;
    z-index: 10;
    width: 390px;
    min-height: 680px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 30px 50px;
  }

  /* Glass card */
  .card {
    width: 100%;
    background: rgba(200, 170, 145, 0.38);
    backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border-radius: 28px;
    border: 1.5px solid rgba(255,255,255,0.55);
    padding: 36px 30px 32px;
    box-shadow:
      0 8px 32px rgba(100,60,20,0.18),
      inset 0 1px 0 rgba(255,255,255,0.4);
    animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-title {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
    text-shadow: 0 1px 6px rgba(100,60,20,0.25);
  }

  .card-subtitle {
    font-size: 13.5px;
    font-weight: 400;
    color: rgba(255,255,255,0.88);
    margin-bottom: 26px;
    letter-spacing: 0.1px;
    text-shadow: 0 1px 4px rgba(100,60,20,0.2);
  }

  /* Input field */
  .input-group {
    position: relative;
    margin-bottom: 16px;
  }

  .input-field {
    width: 100%;
    background: rgba(200,170,145,0.30);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1.5px solid rgba(255,255,255,0.6);
    border-radius: 14px;
    padding: 15px 46px 15px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    letter-spacing: 0.2px;
  }

  .input-field::placeholder {
    color: rgba(255,255,255,0.80);
    font-weight: 400;
  }

  .input-field:focus {
    border-color: rgba(255,255,255,0.9);
    background: rgba(210,180,155,0.38);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.12);
  }

  /* Input icon */
  .input-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.80);
    pointer-events: none;
    display: flex;
    align-items: center;
  }

  .toggle-pw {
    pointer-events: all;
    cursor: pointer;
    transition: color 0.2s;
  }
  .toggle-pw:hover { color: #fff; }

  /* Remember me */
  .remember-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0 20px;
  }

  .custom-checkbox {
    width: 20px;
    height: 20px;
    border: 1.5px solid rgba(255,255,255,0.7);
    border-radius: 5px;
    background: rgba(200,165,135,0.30);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
    position: relative;
  }
  .custom-checkbox.checked {
    background: rgba(210,160,120,0.55);
    border-color: rgba(255,255,255,0.85);
  }
  .custom-checkbox .checkmark {
    opacity: 0;
    transition: opacity 0.15s;
  }
  .custom-checkbox.checked .checkmark {
    opacity: 1;
  }

  .remember-label {
    font-size: 13.5px;
    color: rgba(255,255,255,0.88);
    cursor: pointer;
    user-select: none;
    font-weight: 400;
  }

  /* Login button */
  .btn-login {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #d4956a 0%, #c4825a 50%, #b87050 100%);
    border: none;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    letter-spacing: 0.3px;
    box-shadow:
      0 4px 18px rgba(160,90,50,0.38),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
    position: relative;
    overflow: hidden;
  }

  .btn-login::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
    border-radius: 14px;
  }

  .btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(160,90,50,0.48), inset 0 1px 0 rgba(255,255,255,0.25);
    filter: brightness(1.06);
  }

  .btn-login:active {
    transform: translateY(1px);
    box-shadow: 0 2px 10px rgba(160,90,50,0.3);
  }

  /* Signup link */
  .signup-row {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.80);
    font-weight: 400;
  }

  .signup-row strong {
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .signup-row strong:hover { opacity: 0.75; }

  /* Archived footer */
  .archived {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: rgba(255,255,255,0.60);
    font-style: normal;
    letter-spacing: 0.1px;
  }
  .archived span {
    font-style: italic;
    font-size: 11.5px;
  }

  /* SVG foliage */
  svg.foliage { display: block; }
</style>
</head>
<body>

<!-- Background layers -->
<div class="bg"></div>
<div class="building"></div>
<div class="dapple"></div>

<!-- SVG Foliage top -->
<svg class="foliage-top" viewBox="0 0 390 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style="position:fixed;top:0;left:0;right:0;width:100%;z-index:2;pointer-events:none;">
  <!-- Main dark green branch cluster top-left -->
  <g opacity="0.82">
    <ellipse cx="60" cy="0" rx="75" ry="55" fill="#2a3d20" transform="rotate(-15 60 0)"/>
    <ellipse cx="30" cy="30" rx="55" ry="40" fill="#2d4422" transform="rotate(10 30 30)"/>
    <ellipse cx="100" cy="10" rx="60" ry="38" fill="#253820" transform="rotate(-25 100 10)"/>
    <ellipse cx="20" cy="60" rx="45" ry="30" fill="#1e3018"/>
    <ellipse cx="80" cy="40" rx="50" ry="28" fill="#2a3d1e" transform="rotate(-30 80 40)"/>
    <ellipse cx="145" cy="5" rx="48" ry="30" fill="#253820" transform="rotate(-10 145 5)"/>
    <ellipse cx="50" cy="80" rx="40" ry="25" fill="#1e2e18" transform="rotate(5 50 80)"/>
  </g>
  <!-- Right side branch cluster -->
  <g opacity="0.78">
    <ellipse cx="330" cy="0" rx="70" ry="50" fill="#2a3d20" transform="rotate(20 330 0)"/>
    <ellipse cx="370" cy="25" rx="55" ry="38" fill="#2d4422" transform="rotate(-10 370 25)"/>
    <ellipse cx="310" cy="15" rx="48" ry="32" fill="#253820" transform="rotate(30 310 15)"/>
    <ellipse cx="355" cy="55" rx="42" ry="26" fill="#1e3018" transform="rotate(5 355 55)"/>
    <ellipse cx="290" cy="45" rx="38" ry="24" fill="#223820" transform="rotate(-15 290 45)"/>
  </g>
  <!-- Hanging leaves / tips -->
  <g opacity="0.70">
    <ellipse cx="140" cy="85" rx="18" ry="28" fill="#2a3d1e" transform="rotate(-20 140 85)"/>
    <ellipse cx="165" cy="95" rx="14" ry="22" fill="#253820" transform="rotate(10 165 95)"/>
    <ellipse cx="118" cy="100" rx="12" ry="20" fill="#1e3018" transform="rotate(-5 118 100)"/>
    <ellipse cx="240" cy="80" rx="16" ry="26" fill="#2a3d20" transform="rotate(15 240 80)"/>
    <ellipse cx="265" cy="95" rx="13" ry="21" fill="#253820" transform="rotate(-10 265 95)"/>
  </g>
  <!-- Sky/warm blur showing through -->
  <rect x="150" y="0" width="90" height="60" fill="rgba(190,160,120,0.18)" rx="20"/>
</svg>

<!-- Ground -->
<div class="ground"></div>

<!-- Main card -->
<div class="phone-wrapper">
  <div class="card">
    <div class="card-title">Login</div>
    <div class="card-subtitle">welcome back please login to your account</div>

    <!-- Username -->
    <div class="input-group">
      <input class="input-field" type="text" placeholder="User Name" id="username" autocomplete="username">
      <span class="input-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </span>
    </div>

    <!-- Password -->
    <div class="input-group">
      <input class="input-field" type="password" placeholder="Password" id="password" autocomplete="current-password">
      <span class="input-icon toggle-pw" onclick="togglePassword()" id="eyeIcon" title="Toggle password">
        <!-- Eye with slash (hidden state) -->
        <svg id="eyeOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
        <!-- Eye open (visible state) -->
        <svg id="eyeOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </span>
    </div>

    <!-- Remember me -->
    <div class="remember-row">
      <div class="custom-checkbox checked" id="rememberBox" onclick="toggleRemember()">
        <svg class="checkmark" width="13" height="10" viewBox="0 0 13 10" fill="none">
          <path d="M1.5 5L5 8.5L11.5 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="remember-label" onclick="toggleRemember()">Remember me</span>
    </div>

    <!-- Login button -->
    <button class="btn-login" onclick="handleLogin()">Login</button>

    <!-- Sign up -->
    <div class="signup-row">
      Don't have an account? <strong onclick="handleSignup()">Singnup</strong>
    </div>

    <!-- Archive credit -->
    <div class="archived">Archived by <span>cloudiefrancisca20</span></div>
  </div>
</div>

<script>
  function togglePassword() {
    const pw = document.getElementById('password');
    const eyeOff = document.getElementById('eyeOff');
    const eyeOn = document.getElementById('eyeOn');
    if (pw.type === 'password') {
      pw.type = 'text';
      eyeOff.style.display = 'none';
      eyeOn.style.display = 'block';
    } else {
      pw.type = 'password';
      eyeOff.style.display = 'block';
      eyeOn.style.display = 'none';
    }
  }

  function toggleRemember() {
    const box = document.getElementById('rememberBox');
    box.classList.toggle('checked');
  }

  function handleLogin() {
    const btn = document.querySelector('.btn-login');
    btn.textContent = 'Logging in…';
    btn.style.opacity = '0.85';
    setTimeout(() => {
      btn.textContent = 'Login';
      btn.style.opacity = '1';
    }, 1800);
  }

  function handleSignup() {
    alert('Sign up coming soon!');
  }
</script>
</body>
</html>
